<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Dashboard</title>
<style>
  :root{
    --paper:#eae7e0; --ink:#23211d; --ink-soft:#57534a;
    --stamp:#b23a2e; --line:#c9c4b8; --gold:#a68a4c;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'IBM Plex Mono','Courier New',monospace;}
  .wrap{max-width:640px; margin:0 auto; padding:28px 18px 60px;}
  h1{font-family:'Oswald','Arial Narrow',sans-serif; text-transform:uppercase; font-size:26px; letter-spacing:0.5px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:13px; margin:0 0 24px;}
  .card{background:#fbfaf7; border:1px solid var(--line); padding:22px; margin-bottom:16px;}
  label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin-bottom:6px;}
  input{width:100%; font-family:inherit; font-size:14px; padding:12px; border:1px solid var(--line); background:var(--paper); margin-bottom:12px;}
  button{width:100%; padding:14px; background:var(--ink); color:#fbfaf7; border:none; font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:1px; font-weight:600; cursor:pointer;}
  button:hover{background:var(--stamp);}
  .stats{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:#fbfaf7; border:1px solid var(--line); padding:16px; text-align:center;}
  .stat .num{font-family:'Oswald',sans-serif; font-size:28px; font-weight:700;}
  .stat .lbl{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); margin-top:4px;}
  .row{border-bottom:1px dashed var(--line); padding:14px 0;}
  .row:last-child{border-bottom:none;}
  .row-top{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:6px;}
  .stars-lit{color:var(--stamp); font-size:15px; letter-spacing:2px;}
  .msg{font-size:13.5px; line-height:1.5;}
  .contact{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .hidden{display:none;}
  .signout{background:transparent; border:1px solid var(--ink); color:var(--ink); margin-top:0; width:auto; padding:8px 14px; font-size:11px;}
  .top-row{display:flex; justify-content:space-between; align-items:flex-start;}
  .empty{color:var(--ink-soft); font-size:13px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginCard" class="card">
    <h1>Owner Login</h1>
    <p class="sub">Sign in to see your review activity.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <button id="sendLink">Send Login Link</button>
    <div id="loginStatus" class="sub" style="margin-top:10px; margin-bottom:0;"></div>
  </div>

  <div id="dashboardArea" class="hidden">
    <div class="top-row">
      <div>
        <h1 id="bizName">—</h1>
        <p class="sub">Everything customers have told you.</p>
      </div>
      <button class="signout" id="signOut">Sign out</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Responses</div></div>
      <div class="stat"><div class="num" id="statAvg">0.0</div><div class="lbl">Avg Rating</div></div>
      <div class="stat"><div class="num" id="statLow">0</div><div class="lbl">1–3 Star</div></div>
    </div>

    <div class="card">
      <h1 style="font-size:16px;">Recent Feedback</h1>
      <div id="feedbackList"></div>
    </div>
  </div>

</div>

<script type="module">
  // ---- FILL THESE IN FROM YOUR SUPABASE PROJECT SETTINGS ----
  const SUPABASE_URL = "https://mufxckitwgqgnocitzup.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_ecr36a_JHgyRbtieTWqBxg_IAqQqZYp";
  // -------------------------------------------------------------

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginCard = document.getElementById('loginCard');
  const dashboardArea = document.getElementById('dashboardArea');

  document.getElementById('sendLink').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const status = document.getElementById('loginStatus');
    if (!email) { status.textContent = "Enter your email first."; return; }
    status.textContent = "Sending...";
    const { error } = await supabase.auth.signInWithOtp({ email });
    status.textContent = error ? "Couldn't send link — try again." : "Check your email for a login link.";
  });

  document.getElementById('signOut').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.reload();
  });

  async function loadDashboard(){
    const { data: bizRows } = await supabase
      .from('businesses')
      .select('id, name')
      .limit(1)
      .maybeSingle();

    if (!bizRows) {
      document.getElementById('loginStatus').textContent = "No business is linked to this login yet — contact your card provider.";
      return;
    }

    loginCard.classList.add('hidden');
    dashboardArea.classList.remove('hidden');
    document.getElementById('bizName').textContent = bizRows.name;

    const { data: subs } = await supabase
      .from('submissions')
      .select('rating, message, contact, created_at')
      .eq('business_id', bizRows.id)
      .order('created_at', { ascending: false });

    const rows = subs || [];
    const total = rows.length;
    const avg = total ? (rows.reduce((s,r) => s + r.rating, 0) / total).toFixed(1) : '0.0';
    const low = rows.filter(r => r.rating <= 3).length;

    document.getElementById('statTotal').textContent = total;
    document.getElementById('statAvg').textContent = avg;
    document.getElementById('statLow').textContent = low;

    const list = document.getElementById('feedbackList');
    const withMessages = rows.filter(r => r.message);
    if (!withMessages.length) {
      list.innerHTML = '<div class="empty">No written feedback yet.</div>';
    } else {
      list.innerHTML = withMessages.map(r => `
        <div class="row">
          <div class="row-top">
            <span class="stars-lit">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
            <span>${new Date(r.created_at).toLocaleDateString('en-US',{month:'short',day:'2-digit'})}</span>
          </div>
          <div class="msg">${escapeHtml(r.message)}</div>
          ${r.contact ? `<div class="contact">Contact: ${escapeHtml(r.contact)}</div>` : ''}
        </div>
      `).join('');
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (session) loadDashboard();
  });

  // handle the case where they're already logged in on page load
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) loadDashboard();
  });
</script>
</body>
</html>
